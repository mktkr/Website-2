<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estate Plan Scorecard | Mesa Estate Planning</title>
  <meta name="description" content="Answer a few quick questions to discover what estate plan fits your life — and what it might cost. Free, no login required." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #FAF8F4;
      color: #2D3748;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    input::placeholder { color: #A0AEC0; }

    .header { background: #fff; border-bottom: 1px solid #E8E4DE; padding: 14px 24px; text-align: center; }
    .header-brand { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: #5C7A6B; letter-spacing: 0.02em; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 20px 60px; }

    /* Fade transition */
    .step-content { opacity: 0; transform: translateY(12px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .step-content.visible { opacity: 1; transform: translateY(0); }

    /* Typography */
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: #1A202C; text-align: center; margin: 0 0 14px; }
    .page-subtitle { font-size: 16px; color: #718096; text-align: center; margin: 0 0 6px; }
    .page-meta { font-size: 13px; color: #A0AEC0; text-align: center; margin: 0 0 32px; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: #1A202C; margin: 0 0 6px; }
    .section-desc { font-size: 14px; color: #718096; margin: 0 0 20px; }
    .field-label { font-size: 13px; font-weight: 600; color: #4A5568; margin-bottom: 8px; }

    /* Progress bar */
    .progress { display: flex; gap: 4px; margin-bottom: 24px; }
    .progress-seg { flex: 1; height: 4px; border-radius: 2px; background: #E2E8F0; transition: background 0.3s; }
    .progress-seg.active { background: #5C7A6B; }

    /* Radio / Checkbox options */
    .option-btn {
      display: flex; flex-direction: column; width: 100%; text-align: left;
      padding: 16px 18px; border-radius: 10px; cursor: pointer;
      border: 1px solid #E2E8F0; background: #fff;
      font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .option-btn:hover { border-color: #5C7A6B; }
    .option-btn.selected { border: 2px solid #5C7A6B; background: #EDF7F0; }
    .option-btn .opt-title { font-size: 15px; font-weight: 600; color: #1A202C; }
    .option-btn .opt-sub { font-size: 13px; color: #718096; margin-top: 2px; }

    .check-btn {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 14px 16px; border-radius: 10px; cursor: pointer;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 15px; color: #1A202C; outline: none; margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .check-btn:hover { border-color: #5C7A6B; }
    .check-btn.checked { border: 2px solid #5C7A6B; background: #EDF7F0; }
    .check-box {
      width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;
      border: 2px solid #CBD5E0; background: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .check-btn.checked .check-box { border: none; background: #5C7A6B; }

    /* Buttons */
    .btn-primary {
      display: block; width: 100%; padding: 16px; margin-top: 12px;
      background: #5C7A6B; color: #fff; font-size: 16px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #4A6858; }
    .btn-primary:disabled { background: #A0AEC0; cursor: not-allowed; }

    .btn-back {
      background: none; border: none; cursor: pointer;
      font-size: 14px; color: #718096; padding: 0; margin-bottom: 16px;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-back:hover { color: #4A5568; }

    /* Results page */
    .results-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; color: #1A202C; text-align: center; margin: 0 0 12px; }
    .badge { display: inline-block; padding: 6px 22px; border-radius: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #E8E4DE; padding: 24px; }
    .r-h2 { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; color: #1A202C; margin: 0 0 16px; }

    /* Insight rows */
    .insight-row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .insight-icon { flex-shrink: 0; margin-top: 1px; }
    .insight-heard { font-size: 13px; color: #718096; margin-bottom: 2px; }
    .insight-prot { font-size: 15px; color: #1A202C; display: flex; gap: 8px; align-items: flex-start; }

    /* Risk section */
    .risk-card { background: #FFFDF5; border-radius: 12px; border: 1px solid #F0E9D6; padding: 22px 24px; }
    .risk-h2 { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; color: #7C6A3A; margin: 0 0 14px; }
    .risk-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #6B5D3E; line-height: 1.55; margin-bottom: 10px; }

    /* Fee section */
    .fee-block { background: #2D3748; border-radius: 12px 12px 0 0; padding: 24px 24px 20px; color: #fff; }
    .fee-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #A0AEC0; margin-bottom: 4px; }
    .fee-big { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 700; }
    .fee-est { font-size: 14px; font-weight: 400; color: #A0AEC0; margin-left: 8px; }
    .fee-cards { display: flex; gap: 10px; margin-bottom: 14px; }
    .fee-card { flex: 1; padding: 14px 16px; border-radius: 8px; background: rgba(255,255,255,0.07); }
    .fee-card-label { font-size: 11px; color: #A0AEC0; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .fee-card-val { font-size: 26px; font-weight: 700; font-family: 'Cormorant Garamond', serif; }
    .fee-total-label { font-size: 11px; color: #A0AEC0; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .fee-total-val { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; }
    .fee-total-est { font-size: 12px; font-weight: 400; color: #A0AEC0; margin-left: 8px; }
    .fee-note { font-size: 13px; color: #CBD5E0; margin-top: 10px; line-height: 1.6; }

    /* Docs */
    .docs-block { background: #fff; border-radius: 0 0 12px 12px; border: 1px solid #E8E4DE; border-top: none; padding: 20px 24px 24px; }
    .docs-label { font-size: 13px; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .doc-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; border: 1px solid #E8E4DE; background: #fff; margin-bottom: 6px; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-size: 14px; font-weight: 600; color: #1A202C; }
    .doc-desc { font-size: 12px; color: #718096; }
    .doc-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
    .doc-tag.primary { background: #5C7A6B; color: #fff; }
    .doc-tag.secondary { background: #E6F0EB; color: #5C7A6B; }
    .spouse-note { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: #F7F5F0; font-size: 13px; color: #5C7A6B; display: flex; align-items: flex-start; gap: 10px; }

    /* Steps */
    .steps-row { display: flex; gap: 8px; }
    .step-col { flex: 1; text-align: center; }
    .step-num { width: 34px; height: 34px; border-radius: 50%; background: #5C7A6B; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .step-title { font-size: 13px; font-weight: 600; color: #1A202C; margin-bottom: 2px; }
    .step-desc { font-size: 12px; color: #718096; }

    /* CTA */
    .cta-primary { display: block; padding: 16px 24px; background: #5C7A6B; color: #fff; font-size: 16px; font-weight: 700; text-align: center; border-radius: 10px; text-decoration: none; }
    .cta-primary:hover { background: #4A6858; }
    .cta-secondary { padding: 12px 24px; background: transparent; color: #5C7A6B; font-size: 14px; font-weight: 700; border: 2px solid #5C7A6B; border-radius: 10px; cursor: pointer; width: 100%; }
    .cta-secondary:hover { background: #EDF7F0; }
    .cta-phone { text-align: center; margin: 8px 0 0; font-size: 14px; color: #5C7A6B; }
    .cta-pdf { padding: 10px 20px; background: transparent; color: #9C7E4A; font-size: 13px; font-weight: 600; border: 1.5px solid #9C7E4A; border-radius: 8px; cursor: pointer; }
    .cta-pdf:hover { background: #FBF8F1; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: #1A202C; text-align: center; margin: 0 0 6px; }
    .modal-sub { font-size: 14px; color: #718096; text-align: center; margin: 0 0 20px; line-height: 1.5; }
    .modal-input {
      display: block; width: 100%; padding: 13px 14px; margin-bottom: 10px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      border: 1px solid #E2E8F0; border-radius: 8px; background: #FAF8F4;
      outline: none; box-sizing: border-box;
    }
    .modal-input:focus { border-color: #5C7A6B; }
    .modal-submit {
      display: block; width: 100%; padding: 14px; background: #5C7A6B; color: #fff;
      font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 4px;
    }
    .modal-privacy { font-size: 11px; color: #A0AEC0; text-align: center; margin-top: 10px; }

    .success-box { padding: 10px 16px; background: #EDF7F0; border-radius: 8px; font-size: 14px; color: #276749; text-align: center; }
    .success-box-bronze { font-size: 13px; color: #9C7E4A; text-align: center; }

    .footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid #E8E4DE; text-align: center; font-size: 11px; color: #A0AEC0; line-height: 1.8; }

    /* Responsive */
    @media (max-width: 480px) {
      .fee-cards { flex-direction: column; }
      .steps-row { flex-direction: column; gap: 16px; }
      .fee-card-val { font-size: 22px; }
    }
  </style>
</head>

  <div class="header-brand">Mesa Estate Planning</div>

  <div id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- html2pdf for client-side PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══ SVG Icons ═══ */
const Icons = {
  check: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{flexShrink:0,marginTop:3}}><circle cx="8" cy="8" r="8" fill="#5C7A6B" opacity="0.15"/><path d="M4.5 8.5L6.5 10.5L11.5 5.5" stroke="#5C7A6B" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  note: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{flexShrink:0,marginTop:3}}><circle cx="8" cy="8" r="7" stroke="#B7791F" strokeWidth="1.2" opacity="0.5"/><path d="M8 5V8.5" stroke="#B7791F" strokeWidth="1.4" strokeLinecap="round"/><circle cx="8" cy="11" r="0.7" fill="#B7791F"/></svg>,
  back: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M10 3L5 8l5 5"/></svg>,
  checkSmall: <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L5 9L9.5 3.5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  doc: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style={{flexShrink:0}}><rect x="4" y="2" width="16" height="20" rx="2.5" fill="#5C7A6B" opacity="0.1" stroke="#5C7A6B" strokeWidth="1"/><path d="M8 8H16M8 11.5H16M8 15H13" stroke="#5C7A6B" strokeWidth="1" strokeLinecap="round"/></svg>,
  people: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="7" cy="7" r="2.5"/><circle cx="14" cy="7" r="2.5"/><path d="M2 18v-2a4 4 0 014-4h2M12 12h2a4 4 0 014 4v2"/></svg>,
  clipboard: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="12" height="15" rx="2"/><path d="M7 3V2a1 1 0 011-1h4a1 1 0 011 1v1"/><path d="M7 9h6M7 12h4"/></svg>,
  document: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 2h7l4 4v11a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M12 2v4h4"/><path d="M7 10h6M7 13h4"/></svg>,
  refresh: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 10a7 7 0 0113.2-3.2M17 10a7 7 0 01-13.2 3.2"/><path d="M16 3v4h-4M4 17v-4h4"/></svg>,
  baby: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="10" cy="8" r="5"/><path d="M5.5 13.5C6.5 16 8 17.5 10 17.5s3.5-1.5 4.5-4"/><circle cx="8" cy="7.5" r="0.5" fill="#5C7A6B"/><circle cx="12" cy="7.5" r="0.5" fill="#5C7A6B"/><path d="M8.5 9.5a1.5 1.5 0 003 0"/></svg>,
  ring: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="10" cy="11" r="6"/><circle cx="10" cy="11" r="3"/><path d="M10 5V2M8 3l2-1 2 1"/></svg>,
  building: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="10" height="14" rx="1"/><rect x="13" y="8" width="5" height="10" rx="1"/><path d="M6 8h2M6 11h2M6 14h2M15 11h1M15 14h1"/></svg>,
  house: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 10l7-7 7 7"/><path d="M5 9v7a1 1 0 001 1h8a1 1 0 001-1V9"/><path d="M8 17v-5h4v5"/></svg>,
  family: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="7" cy="5" r="2"/><circle cx="13" cy="5" r="2"/><path d="M4 18v-2a3 3 0 013-3h0M16 18v-2a3 3 0 00-3-3h0"/><circle cx="10" cy="9" r="1.5"/><path d="M7.5 18v-1.5a2.5 2.5 0 015 0V18"/></svg>,
  chart: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 17V7l4 3 4-6 4 4v9"/><path d="M3 17h14"/></svg>,
  shield: <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C7A6B" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2l6 3v5c0 3.5-2.5 6.5-6 8-3.5-1.5-6-4.5-6-8V5l6-3z"/><path d="M7.5 10l2 2 3.5-3.5"/></svg>,
};

const insightIconMap = {
  no_plan: Icons.clipboard, will_only: Icons.document, outdated: Icons.refresh,
  minor_children: Icons.baby, married: Icons.ring, business: Icons.building,
  real_estate: Icons.house, blended: Icons.family, tax: Icons.chart, asset_protection: Icons.shield,
};

/* ═══ APPS SCRIPT ENDPOINT — replace with your actual URL ═══ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6eeJCeExh5GvmBN8GkDvBUj0VezquXYQt2aqIb507UDucFRi1hlcHEWaHjSOagyVDAQ/exec";

async function submitLead(formData, quizAnswers, source) {
  const payload = {
    ...formData,
    source: source, // "scorecard-toolkit" or "scorecard-pdf"
    currentPlan: quizAnswers.currentPlan,
    maritalStatus: quizAnswers.maritalStatus,
    minorChildren: quizAnswers.minorChildren,
    adultChildren: quizAnswers.adultChildren,
    blendedFamily: quizAnswers.blendedFamily,
    netWorth: quizAnswers.netWorth,
    ownsExtraRealEstate: quizAnswers.ownsExtraRealEstate,
    ownsBusiness: quizAnswers.ownsBusiness,
    priorities: quizAnswers.priorities.join(", "),
    timestamp: new Date().toISOString(),
  };
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    console.error("Lead submission error:", e);
  }
}

/* ═══ Results Engine ═══ */
function computeResults(a) {
  let c = 0;
  if (a.currentPlan === "none") c += 2;
  else if (a.currentPlan === "will_only") c += 1.5;
  else if (a.currentPlan === "outdated") c += 1;
  if (a.maritalStatus === "married" || a.maritalStatus === "domestic_partner") c += 1;
  if (a.minorChildren) c += 2;
  if (a.adultChildren) c += 0.5;
  if (a.blendedFamily) c += 1.5;
  if (a.netWorth === "under_500k") c += 0.5;
  else if (a.netWorth === "500k_1m") c += 1;
  else if (a.netWorth === "1m_3m") c += 1.5;
  else if (a.netWorth === "3m_5m") c += 2;
  else if (a.netWorth === "5m_plus") c += 3;
  if (a.ownsExtraRealEstate) c += 1;
  if (a.ownsBusiness) c += 2;
  c += a.priorities.length * 0.3;

  let urgencyLabel, tierColor, tierBg;
  if (c >= 8) { urgencyLabel = "Critical Priority"; tierColor = "#9B2C2C"; tierBg = "#FED7D7"; }
  else if (c >= 5) { urgencyLabel = "High Priority"; tierColor = "#B7791F"; tierBg = "#FEFCBF"; }
  else if (c >= 3) { urgencyLabel = "Important"; tierColor = "#2C7A7B"; tierBg = "#B2F5EA"; }
  else { urgencyLabel = "Getting Started"; tierColor = "#5C7A6B"; tierBg = "#E6F0EB"; }

  const insights = [];
  if (a.currentPlan === "none") insights.push({k:"no_plan",h:"You don't have any estate planning documents yet",p:"A revocable living trust becomes the foundation of your plan"});
  else if (a.currentPlan === "will_only") insights.push({k:"will_only",h:"You have a will but no trust",p:"A trust-based plan keeps your estate out of probate court"});
  else if (a.currentPlan === "outdated") insights.push({k:"outdated",h:"Your plan hasn't been updated in 3+ years",p:"An updated plan ensures your documents reflect your current wishes"});
  if (a.minorChildren) insights.push({k:"minor_children",h:"You have minor children",p:"Guardian nominations let you choose who raises them — not a court"});
  if (a.maritalStatus === "married") insights.push({k:"married",h:"You're married",p:"Spousal protections and a complete document set for both of you, included"});
  if (a.ownsBusiness) insights.push({k:"business",h:"You own a business",p:"A succession plan keeps operations running and protects your family's income"});
  if (a.ownsExtraRealEstate) insights.push({k:"real_estate",h:"You own multiple properties",p:"Deed transfers move each property into your trust to avoid separate probates"});
  if (a.blendedFamily) insights.push({k:"blended",h:"You have a blended family",p:"Clear trust terms protect each side and prevent inheritance disputes"});
  if ((a.netWorth==="3m_5m"||a.netWorth==="5m_plus")&&a.priorities.includes("minimizing_taxes")) insights.push({k:"tax",h:"Your estate may be subject to federal estate tax",p:"Advanced strategies can reduce your tax exposure significantly"});
  if (a.priorities.includes("asset_protection")&&!a.ownsBusiness) insights.push({k:"asset_protection",h:"Asset protection is important to you",p:"Trust structures can shield assets from potential lawsuits and creditors"});

  const risks = [];
  if (a.minorChildren) risks.push("Without a guardian designation, an Arizona court would decide who cares for your children");
  if (a.ownsBusiness) risks.push("Without a succession plan, your business may face disruption if something happens to you");
  if (a.ownsExtraRealEstate) risks.push("Properties not held in trust may require separate probate proceedings in each jurisdiction");
  if (a.blendedFamily) risks.push("Without clear trust terms, blended families often face costly inheritance disagreements");
  if (a.currentPlan==="none"||a.currentPlan==="will_only") risks.push("Without a trust, your estate would go through Arizona probate — typically 6–12 months with court costs");
  if (!risks.length) risks.push("Without documents in place, Arizona default laws — not your wishes — determine what happens");

  const docs = [
    {n:"Revocable Living Trust",d:"Core of your plan",t:"TRUST PACKAGE",p:true},
    {n:"Pour-Over Will",d:"Safety net + guardians",t:"TRUST PACKAGE",p:true},
    {n:"Financial Power of Attorney",d:"Your chosen person manages finances",t:"INCLUDED",p:false},
    {n:"Healthcare Directive",d:"Medical decisions if you can't speak",t:"INCLUDED",p:false},
    {n:"Mental Health Directive",d:"Mental health treatment preferences",t:"INCLUDED",p:false},
  ];
  if (a.minorChildren) docs.push({n:"Guardian Nomination",d:"You choose — not a judge",t:"INCLUDED",p:false});
  if (a.ownsExtraRealEstate) docs.push({n:"Deed Transfers",d:"Move properties into your trust",t:"TRUST PACKAGE",p:true});

  const isComplex = a.ownsBusiness||a.blendedFamily||a.netWorth==="3m_5m"||a.netWorth==="5m_plus"||a.priorities.includes("business_succession")||a.priorities.includes("minimizing_taxes");
  let fee;
  if (a.maritalStatus==="single"&&!isComplex) fee={low:"$1,100",high:"$2,050"};
  else if (!isComplex) fee={low:"$2,050",high:"$3,050"};
  else fee={eLow:"$2,050",eHigh:"$3,050",bLow:"$1,000",bHigh:"$1,500",tLow:"$3,050",tHigh:"$4,550"};

  return {urgencyLabel,tierColor,tierBg,insights,risks,docs,fee,isComplex};
}

/* ═══ Email Gate Modal ═══ */
function EmailGate({title, subtitle, onClose, onSubmit}) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [phone, setPhone] = useState("");
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <p className="modal-sub">{subtitle}</p>
        <input className="modal-input" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} />
        <input className="modal-input" placeholder="Email Address" type="email" value={email} onChange={e=>setEmail(e.target.value)} />
        <input className="modal-input" placeholder="Phone Number" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} />
        <button className="modal-submit" onClick={()=>onSubmit({name,email,phone})} disabled={!name||!email}>Send It</button>
        <p className="modal-privacy">We respect your privacy. No spam, ever.</p>
      </div>
    </div>
  );
}
